name: activity-overview

# One end-to-end pipeline for the activity-overview skill:
#   tests (offline, every push/PR)  ->  live (real gather -> journey-graph
#   store -> trust audit -> view -> link -> render, on demand / scheduled / on a
#   push to the default branch). The journey-graph store is the deliverable;
#   `validate.py` is the gate that proves the graph is consistent, and the live
#   job then asserts the store is not trivially incomplete (minimum node / edge
#   counts) and runs the report path (view -> link -> render) on the real store
#   (#112). Diagrams are compiled with mmdc only in the `tests` job (installed,
#   pinned; under CI=true the mmdc diagram tests fail rather than skip if it is
#   missing); the live job renders with --skip-validate.
#
# Hardening (#72, #112): no `${{ ... }}` expression appears inside any `run:`
# body — untrusted values (dispatch inputs) reach the shell only through `env:`
# and are validated with strict regexes before use; third-party actions are
# pinned to full commit SHAs (tag noted in a trailing comment); downloaded tool
# binaries are checked against pinned sha256 values; every checkout drops its
# credential (`persist-credentials: false`); every job has a timeout. The IaC
# builds in the live jobs (`bicep restore` / `terraform init`) download and run
# third-party code chosen by the gathered repository (docs/LLD.md 14.4).

on:
  push:
    paths:
      - ".claude/skills/activity-overview/**"
      - ".github/workflows/activity-overview.yml"
  pull_request:
    paths:
      - ".claude/skills/activity-overview/**"
      - ".github/workflows/activity-overview.yml"
  workflow_dispatch:
    inputs:
      owner:
        description: "Target repo owner"
        required: false
        default: "Azure"
      repo:
        description: "Target repo name"
        required: false
        default: "bicep-registry-modules"
      from:
        description: "Window start (YYYY-MM-DD; blank = 14 days before --to)"
        required: false
        default: ""
      to:
        description: "Window end (YYYY-MM-DD; blank = today, UTC)"
        required: false
        default: ""
      token_source:
        description: "Token for the live gathers: this workflow's built-in token (default; public repos only), or the ACTIVITY_TEST_TOKEN secret (needed for private targets)"
        required: false
        type: choice
        default: "builtin"
        options:
          - "builtin"
          - "secret"
      home_orgs:
        description: "Organisations (besides the owner) whose members count as the maintainers' organisation, comma-separated; 'none' for none"
        required: false
        default: "microsoft"
      home_names:
        description: "Company names meaning the maintainers' organisation in a public profile, comma-separated; 'none' for none"
        required: false
        default: "Microsoft"
      home_email_domains:
        description: "Commit email domains meaning the maintainers' organisation, comma-separated; 'none' for none"
        required: false
        default: "microsoft.com"
  schedule:
    # 07:00 UTC on the 1st and 15th of each month (trailing-14-day window).
    - cron: "0 7 1,15 * *"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Pinned so the diagram gate is reproducible. Bump deliberately.
      MERMAID_CLI_VERSION: 12.2.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing later pushes or calls git with this credential (#112).
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile every module
        run: |
          # Glob, not a hand-kept list, so a new CLI/module is always covered.
          # failglob: an empty match is an error, never a silent no-op.
          shopt -s failglob
          python -m py_compile \
            .claude/skills/activity-overview/*.py \
            .claude/skills/activity-overview/samples/*.py \
            .claude/skills/activity-overview/examples/formatters/*.py

      - name: Set up Node (for mermaid-cli)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # mermaid-cli 12.x requires node >= 22.13.
          node-version: "22"

      - name: Install mermaid-cli (mmdc) for the diagram compile tests
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/mermaid-cli"
          npm install --no-audit --no-fund --prefix "$prefix" \
            "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}"
          # Ubuntu runners restrict unprivileged user namespaces, so headless
          # Chrome cannot start its sandbox; run puppeteer with --no-sandbox via
          # an `mmdc` wrapper first on PATH (render.py invokes plain `mmdc`).
          cfg="$RUNNER_TEMP/puppeteer-config.json"
          printf '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}\n' > "$cfg"
          bindir="$RUNNER_TEMP/mmdc-bin"
          mkdir -p "$bindir"
          printf '#!/usr/bin/env bash\nexec %q -p %q "$@"\n' \
            "$prefix/node_modules/.bin/mmdc" "$cfg" > "$bindir/mmdc"
          chmod +x "$bindir/mmdc"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Prove mmdc compiles a diagram
        run: |
          set -euo pipefail
          command -v mmdc
          installed="$(mmdc --version)"
          echo "mmdc $installed"
          case "$installed" in
            *"${MERMAID_CLI_VERSION}"*) ;;
            *) echo "::error::mmdc version mismatch: wanted ${MERMAID_CLI_VERSION}, got '$installed'"; exit 1 ;;
          esac
          printf 'pie\n    "A" : 1\n' > "$RUNNER_TEMP/probe.mmd"
          mmdc -i "$RUNNER_TEMP/probe.mmd" -o "$RUNNER_TEMP/probe.svg" -q
          test -s "$RUNNER_TEMP/probe.svg"

      - name: Run the offline test suite
        env:
          # GitHub sets CI=true already; stated explicitly because the mmdc
          # diagram tests FAIL (not skip) without a working mmdc when CI=true.
          CI: "true"
        run: |
          python -m unittest discover \
            -s .claude/skills/activity-overview -p 'test_*.py' -v

  live:
    # The real gather is heavy (clone + API), so it runs only on demand, on the
    # schedule, or on a push to the default branch — not on every feature push.
    # It uses the workflow's built-in token by default (accepted for public
    # targets; the Azure enterprise refuses personal tokens that live > 8 days).
    # `token_source: secret` switches to the ACTIVITY_TEST_TOKEN secret.
    needs: tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # A gather that waits for the hourly API limit can legitimately take over an
    # hour (three overlapping runs were observed at 60+ minutes).
    timeout-minutes: 120
    # The three live jobs share one API budget, so they run one at a time: they
    # are chained with `needs` inside a run, and share this group across runs
    # (queue, never cancel a running gather). GitHub keeps at most ONE pending
    # job per group: when runs overlap, a newer pending job replaces an older
    # pending one (that job is cancelled before it starts; re-dispatch it).
    concurrency:
      group: activity-overview-live-gathers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing later pushes or calls git with this credential (#112).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify the integration secret is present
        if: inputs.token_source == 'secret'
        env:
          ACTIVITY_TEST_TOKEN: ${{ secrets.ACTIVITY_TEST_TOKEN }}
        run: |
          if [ -z "$ACTIVITY_TEST_TOKEN" ]; then
            echo "::error::ACTIVITY_TEST_TOKEN secret is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "secret present"

      - name: Resolve target and window
        id: cfg
        env:
          # Dispatch inputs are untrusted: they reach the shell ONLY as env vars
          # (never interpolated into the script) and are validated below.
          IN_OWNER: ${{ inputs.owner }}
          IN_REPO: ${{ inputs.repo }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          # Defaults apply to scheduled runs (no inputs) and blank manual fields.
          OWNER="${IN_OWNER:-Azure}"
          REPO="${IN_REPO:-bicep-registry-modules}"
          FROM="${IN_FROM:-}"
          TO="${IN_TO:-}"
          name_re='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          date_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          # Never echo a rejected value: it could carry workflow commands.
          [[ "$OWNER" =~ $name_re ]] || { echo "::error::invalid 'owner' input (must match $name_re)"; exit 1; }
          [[ "$REPO" =~ $name_re ]] || { echo "::error::invalid 'repo' input (must match $name_re)"; exit 1; }
          for d in FROM TO; do
            v="${!d}"
            [ -z "$v" ] && continue
            if ! [[ "$v" =~ $date_re ]] || [ "$(date -u -d "$v" +%F 2>/dev/null)" != "$v" ]; then
              echo "::error::invalid '${d,,}' input (must be a real YYYY-MM-DD date or blank)"; exit 1
            fi
          done
          [ -z "$TO" ] && TO="$(date -u +%F)"
          [ -z "$FROM" ] && FROM="$(date -u -d "$TO -14 days" +%F)"
          {
            echo "owner=$OWNER"; echo "repo=$REPO"
            echo "from=$FROM"; echo "to=$TO"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved target $OWNER/$REPO over window $FROM -> $TO"

      - name: Install bicep CLI
        env:
          # Pinned so the gate is reproducible and a new bicep release cannot
          # silently change build output. Bump deliberately.
          BICEP_VERSION: v0.43.8
          # sha256 of bicep-linux-x64 for BICEP_VERSION. Bump together with the
          # version (recompute from the official release asset).
          BICEP_SHA256: 03b902a8d4da2df36348d20f039a7e6268798781cdeceb38d8c1760f2843bec8
        run: |
          set -euo pipefail
          curl -sSLo bicep "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          # Verify the binary before it is made executable (supply-chain integrity).
          echo "${BICEP_SHA256}  bicep" | sha256sum -c -
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          installed="$(bicep --version)"
          echo "$installed"
          case "$installed" in
            *"${BICEP_VERSION#v}"*) ;;
            *) echo "::error::bicep version mismatch: wanted ${BICEP_VERSION}, got '$installed'"; exit 1 ;;
          esac

      - name: Gather the real window into the journey-graph store
        env:
          GITHUB_TOKEN: ${{ inputs.token_source == 'secret' && secrets.ACTIVITY_TEST_TOKEN || github.token }}
          OWNER: ${{ steps.cfg.outputs.owner }}
          REPO: ${{ steps.cfg.outputs.repo }}
          FROM: ${{ steps.cfg.outputs.from }}
          TO: ${{ steps.cfg.outputs.to }}
          HOME_ORGS: ${{ inputs.home_orgs || 'microsoft' }}
          HOME_NAMES: ${{ inputs.home_names || 'Microsoft' }}
          HOME_EMAIL_DOMAINS: ${{ inputs.home_email_domains || 'microsoft.com' }}
        run: |
          set -euo pipefail
          cd .claude/skills/activity-overview
          mkdir -p workspace
          # Home settings for the people layer (who counts as the
          # maintainers' organisation). Untrusted inputs: env only, each
          # value checked before it becomes an argument.
          home=()
          add_home() {  # flag, comma-separated list, allowed pattern
            local flag="$1" list="$2" pattern="$3" item
            [ "$list" = "none" ] && return 0
            IFS=',' read -ra items <<< "$list"
            for item in "${items[@]}"; do
              item="${item#"${item%%[![:space:]]*}"}"; item="${item%"${item##*[![:space:]]}"}"
              [ -z "$item" ] && continue
              if ! [[ "$item" =~ $pattern ]]; then
                echo "::error::bad value for $flag: '$item'"; exit 1
              fi
              home+=("$flag" "$item")
            done
          }
          add_home --home-org "$HOME_ORGS" '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
          add_home --home-name "$HOME_NAMES" '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,60}$'
          add_home --home-email-domain "$HOME_EMAIL_DOMAINS" '^[a-z0-9][a-z0-9.-]{0,100}$'
          python gather.py \
            --owner "$OWNER" --repo "$REPO" \
            --from "$FROM" --to "$TO" \
            --store workspace/journey.db \
            --people workspace/people.json \
            "${home[@]}"

      - name: Store sanity (gather produced a non-trivial graph)
        # The store holds exactly the live window (a fresh store per run), so
        # every count is the window's. Minimums are > 0, not tuned numbers: a
        # two-week window of the default target always has each kind; a zero
        # means a gather layer silently produced nothing (#112).
        run: |
          cd .claude/skills/activity-overview
          python - <<'PY'
          import json
          import graphstore
          c = graphstore.open_store("workspace/journey.db")
          n = c.execute("SELECT COUNT(*) FROM nodes").fetchone()[0]
          e = c.execute("SELECT COUNT(*) FROM edges").fetchone()[0]
          ce = c.execute("SELECT COUNT(*) FROM code_events").fetchone()[0]
          print(f"store: nodes={n} edges={e} code_events={ce}")
          assert n > 0 and e > 0, "empty graph — gather produced nothing"
          kinds = {"pr": 0, "issue": 0, "commit": 0}
          for nid, cls, data in c.execute(
                  "SELECT id, node_class, data FROM nodes"):
              local = graphstore.local_id(nid)
              if cls == "social" and local.startswith("pr-"):
                  kinds["pr"] += 1
              elif cls == "social" and local.startswith("issue-"):
                  kinds["issue"] += 1
              elif cls == "code" and "sha" in json.loads(data):
                  kinds["commit"] += 1
          edges = {t: c.execute("SELECT COUNT(*) FROM edges WHERE edge_type = ?",
                                (t,)).fetchone()[0] for t in ("closes", "touches")}
          print("nodes by kind: {}  edges: {}".format(kinds, edges))
          missing = [k for k, v in list(kinds.items()) + list(edges.items()) if v <= 0]
          assert not missing, "store has no {} for the live window".format(missing)
          PY

      - name: Trust gate — audit the real journey-graph
        run: |
          cd .claude/skills/activity-overview
          # validate self-sources the raw bundle from the store (no bundle file);
          # exits non-zero on any ERROR-severity trust violation.
          python validate.py workspace/journey.db

      - name: Report path on the live store (view -> link -> render)
        # The same commands SKILL.md gives (steps 3-5). mmdc is not installed in
        # this job, so diagrams are written but not compiled (--skip-validate).
        env:
          FROM: ${{ steps.cfg.outputs.from }}
          TO: ${{ steps.cfg.outputs.to }}
        run: |
          set -euo pipefail
          cd .claude/skills/activity-overview
          python view.py --store workspace/journey.db --from "$FROM" --to "$TO" \
            --out workspace/view/bundle.json
          python link.py workspace/view/bundle.json
          python render.py workspace/view/bundle.json \
            --diagrams-dir workspace/diagrams --skip-validate
          python - <<'PY'
          import json
          b = json.load(open("workspace/view/bundle.json", encoding="utf-8"))
          counts = {"buckets.shipped": len(b["buckets"]["shipped"]),
                    "trains": len(b["trains"]), "timeline": len(b["timeline"])}
          print("enriched bundle: {}".format(counts))
          empty = [k for k, v in counts.items() if not v]
          assert not empty, "enriched bundle has empty {}".format(empty)
          # One train holding most of the window's PRs means something joined
          # unrelated work (a PR template's commented "Fixes #123" once did, #97).
          big = max(b["trains"], key=lambda t: len(t.get("prs") or []))
          share = len(big.get("prs") or [])
          print("largest train: {} with {} of {} PR(s)".format(
              big.get("id"), share, len(b["prs"])))
          assert share <= 10 or share * 3 <= len(b["prs"]), \
              "train {} holds {} of {} PRs".format(big.get("id"), share, len(b["prs"]))
          PY

      - name: Upload the journey-graph store and the enriched bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: journey-graph
          path: |
            .claude/skills/activity-overview/workspace/journey.db
            .claude/skills/activity-overview/workspace/view/bundle.json
            .claude/skills/activity-overview/workspace/people.json
            .claude/skills/activity-overview/workspace/people-activity.json
          if-no-files-found: warn

  spotlight:
    # Build a real db for a FIXED historical AVM week and run all four spotlight
    # queries against it — "query it exactly as real execution would", not a mock
    # and not a crafted fixture. The window is pinned (early March 2026): historical
    # data does not change, so the gathered graph is stable and the gate is
    # reproducible run to run. Heavy (clone + API) and uses a token (the built-in
    # one by default, the ACTIVITY_TEST_TOKEN secret with `token_source: secret`),
    # so it is gated like `live` — on demand, on schedule, or on a push to the
    # default branch, never on a feature/fork PR. It runs after `live` (whatever
    # live's result) so the two gathers never share the API budget at once.
    needs: [tests, live]
    if: >-
      needs.tests.result == 'success' && !cancelled() && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: activity-overview-live-gathers
      cancel-in-progress: false
    env:
      # Pinned historical week. Bump deliberately (and re-confirm assertions hold).
      SPOTLIGHT_FROM: "2026-03-02"
      SPOTLIGHT_TO: "2026-03-08"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing later pushes or calls git with this credential (#112).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify the integration secret is present
        if: inputs.token_source == 'secret'
        env:
          ACTIVITY_TEST_TOKEN: ${{ secrets.ACTIVITY_TEST_TOKEN }}
        run: |
          if [ -z "$ACTIVITY_TEST_TOKEN" ]; then
            echo "::error::ACTIVITY_TEST_TOKEN secret is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "secret present"

      - name: Gather the fixed historical window into a journey-graph store
        env:
          GITHUB_TOKEN: ${{ inputs.token_source == 'secret' && secrets.ACTIVITY_TEST_TOKEN || github.token }}
        run: |
          cd .claude/skills/activity-overview
          mkdir -p workspace
          python gather.py \
            --owner Azure --repo bicep-registry-modules \
            --from "$SPOTLIGHT_FROM" --to "$SPOTLIGHT_TO" \
            --store workspace/journey_spotlight.db

      - name: Trust gate — audit the gathered graph
        run: |
          cd .claude/skills/activity-overview
          python validate.py workspace/journey_spotlight.db

      - name: Spotlight integration — run all four queries against the real store
        # --require-all: on the real week every check must verify; a check
        # skipped for lack of input (no contributions / areas / code events /
        # indexed text) means the gather regressed, so it fails the job.
        run: |
          cd .claude/skills/activity-overview
          python ci_spotlight_integration.py --store workspace/journey_spotlight.db --require-all

      - name: Upload the journey-graph store
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: journey-graph-spotlight
          path: .claude/skills/activity-overview/workspace/journey_spotlight.db
          if-no-files-found: warn

  constellation:
    # Multi-repo (Phase 9) gate. Dogfoods the whole project vertical on a SMALL
    # fixed AVM-Terraform constellation: generate the manifest from a committed
    # index slice (manifest_from_index.py), gather both members into ONE project
    # store, prove the project graph is trustworthy (validate --project), and assert
    # the digest resolves a CROSS-REPO module-dependency edge (the pattern sourcing
    # the resource module). Terraform is installed so the real `terraform init` +
    # `terraform graph` DOT extraction runs on real modules (parity with the bicep
    # live/spotlight gates); the static whole-tree source scan still backstops the
    # cross-repo edge if a heavy `init` times out. Pinned historical window ->
    # reproducible. Heavy (2 clones + API + terraform init) + uses a token (as
    # `spotlight`), so gated like live/spotlight: on demand, on schedule, or on a
    # default-branch push — never on a feature/fork PR. Runs after `spotlight`
    # (whatever its result) for the shared API budget.
    needs: [tests, spotlight]
    if: >-
      needs.tests.result == 'success' && !cancelled() && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: activity-overview-live-gathers
      cancel-in-progress: false
    env:
      PROJECT: avm-tf-ci-constellation
      # Pinned historical week (stable, reproducible). Bump deliberately.
      C_FROM: "2026-03-16"
      C_TO: "2026-03-22"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing later pushes or calls git with this credential (#112).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Terraform
        env:
          # Pinned so the gate is reproducible and a new terraform release cannot
          # silently change graph output. Bump deliberately. Raw binary (no wrapper)
          # so `terraform graph` DOT reaches the extractor unmodified.
          TERRAFORM_VERSION: 1.15.5
          # sha256 of terraform_${TERRAFORM_VERSION}_linux_amd64.zip, pinned here
          # (#112) instead of trusting a SHA256SUMS file fetched from the same host
          # at run time. Taken from the official terraform_1.15.5_SHA256SUMS after
          # checking its detached signature (SHA256SUMS.sig) against the HashiCorp
          # release key (fingerprint C874 011F 0AB4 0511 0D02 1055 3436 5D94 72D7
          # 468F). Bump together with the version, re-verifying the signature.
          TERRAFORM_SHA256: 702b2136af6728c8ff037f843dd2dbce2b7ad88786b7381d1d72aefa250f601c
        run: |
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          set -euo pipefail
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -sSLo "$zip" "${base}/${zip}"
          # Verify against the pinned checksum before unpacking.
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum -c -
          unzip -o "$zip" terraform
          sudo mv terraform /usr/local/bin/terraform
          installed="$(terraform version | head -1)"
          echo "$installed"
          case "$installed" in
            *"${TERRAFORM_VERSION}"*) ;;
            *) echo "::error::terraform version mismatch: wanted ${TERRAFORM_VERSION}, got '$installed'"; exit 1 ;;
          esac

      - name: Verify the integration secret is present
        if: inputs.token_source == 'secret'
        env:
          ACTIVITY_TEST_TOKEN: ${{ secrets.ACTIVITY_TEST_TOKEN }}
        run: |
          if [ -z "$ACTIVITY_TEST_TOKEN" ]; then
            echo "::error::ACTIVITY_TEST_TOKEN secret is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "secret present"

      - name: Generate the manifest from the committed AVM-index slice
        run: |
          cd .claude/skills/activity-overview
          mkdir -p workspace
          python manifest_from_index.py --index ci/constellation-index.csv \
            --project "$PROJECT" --from "$C_FROM" --to "$C_TO" \
            > workspace/manifest.json
          echo "--- generated manifest ---"; cat workspace/manifest.json

      - name: Gather the constellation into one project store
        env:
          GITHUB_TOKEN: ${{ inputs.token_source == 'secret' && secrets.ACTIVITY_TEST_TOKEN || github.token }}
          # terraform init for an AVM pattern pulls many registry modules: a shared
          # plugin cache avoids re-downloading providers, and each init gets room. A
          # heavy init that still times out degrades gracefully — edge_extraction
          # records timeout/failed and the static whole-tree source scan still
          # backstops the cross-repo edge. Parallel extraction stays safe because
          # gather's prewarm populates the cache for EVERY area serially before the
          # parallel inits (cache hits, no write race) — so we keep the default
          # workers rather than serializing.
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.claude/skills/activity-overview/workspace/.tfcache
          ACTIVITY_IAC_BUILD_TIMEOUT: "600"
        run: |
          cd .claude/skills/activity-overview
          mkdir -p workspace/.tfcache
          python gather.py --manifest workspace/manifest.json \
            --store workspace/journey.db

      - name: Trust gate — validate the whole project graph
        run: |
          cd .claude/skills/activity-overview
          python validate.py workspace/journey.db --project "$PROJECT"

      - name: Digest resolves a cross-repo module-dependency edge
        run: |
          cd .claude/skills/activity-overview
          python digest.py --store workspace/journey.db --project "$PROJECT" \
            --from "$C_FROM" --to "$C_TO" > workspace/digest_view.json
          python - <<'PY'
          import json
          v = json.load(open("workspace/digest_view.json"))
          edges = v["module_edges"]
          xrepo = [e for e in edges if e["cross_repo"]]
          print("members={} trains={} module_edges={} cross_repo={}".format(
              len(v["members"]), len(v["trains"]), len(edges), len(xrepo)))
          for e in xrepo:
              print("  {}/{} -> {}/{} {}".format(
                  e["src_repo"].split("/")[-1], e["src_area"],
                  e["dst_repo"].split("/")[-1], e["dst_area"], e.get("version")))
          assert len(v["members"]) == 2, "expected both members in the project view"
          assert xrepo, "expected >=1 cross-repo module-dependency edge"
          PY

      - name: Upload the project store + digest view
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: journey-graph-constellation
          path: |
            .claude/skills/activity-overview/workspace/journey.db
            .claude/skills/activity-overview/workspace/digest_view.json
          if-no-files-found: warn

